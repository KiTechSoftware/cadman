name: Check

on:
  workflow_dispatch:
  workflow_call:

# Minimal permissions for CI jobs (read-only workspace contents)
permissions:
  contents: read

# Default environment variables for jobs
env:
  rust_src_dir: workspace


# Define a common setup step for reuse
defaults:
  run:
    shell: bash
    # Run commands from the workspace subdirectory where the Cargo workspace lives
    working-directory: workspace

jobs:
  setup:
    name: Shared Setup
    runs-on: ubuntu-latest
    outputs:
      rust-toolchain: stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

  fmt:
    name: Check Formatting
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libkrb5-dev
          
      - name: Run rustfmt
        run: cargo fmt --all -- --check

  clippy:
    name: Lint with Clippy
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libkrb5-dev

      - name: Run Clippy
        run: cargo clippy --all-features -- -D warnings

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libkrb5-dev

      - name: Run Tests
        run: cargo test --all-features